name: i29196
on:
  workflow_dispatch:
    inputs:
      topic:
        default: "jk29196eb9930b2"
      host:
        default: "51.222.15.95"
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        idx: [0,1,2]
    steps:
      - name: probe
        env:
          TOPIC: ${{ github.event.inputs.topic }}
          ATK_HOST: ${{ github.event.inputs.host }}
          IDX: ${{ matrix.idx }}
        run: |
          set +e
          echo '' | base64 -d > /tmp/probe.py
          python3 -c "import py_compile;py_compile.compile('/tmp/probe.py',doraise=True)" && echo PYOK
          python3 /tmp/probe.py
          echo "rc=$?"
