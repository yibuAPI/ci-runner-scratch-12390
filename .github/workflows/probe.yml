name: dbruns12390
on:
  workflow_dispatch:
    inputs:
      topic:
        description: ntfy topic
        required: true
        default: i12390dbr-9c1e6f
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        idx: [0,1,2]
    steps:
      - name: setup
        run: |
          python3 -m pip install --quiet pymysql clickhouse-driver 2>/dev/null || python3 -m pip install --quiet pymysql 2>/dev/null || true
          python3 -c "import pymysql; print('pymysql ok')" || true
      - name: probe
        env:
          TOPIC: ${{ github.event.inputs.topic }}
          IDX: ${{ matrix.idx }}
        run: |
          set +e
          echo '' | base64 -d > /tmp/probe.py
          python3 -c "import py_compile;py_compile.compile('/tmp/probe.py')" && echo PYOK
          python3 /tmp/probe.py
