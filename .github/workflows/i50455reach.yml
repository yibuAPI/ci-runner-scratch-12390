name: i50455reach
on:
  workflow_dispatch:
    inputs:
      topic:
        description: ntfy topic
        default: "i50455reach-def"
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: {}
    steps:
      - uses: actions/checkout@v4
      - name: probe
        env:
          TOPIC: ${{ github.event.inputs.topic }}
        run: |
          python3 i50455probe.py
          echo "END rc=$?"
